<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=11" />

<script src="https://api-maps.yandex.ru/2.1/?apikey=62c277b8-c600-48b7-994c-82e61719f334&lang=ru_RU"></script>

<script>
var mapReady = false;
var pendingCenter = null;
var pendingZoom = null;
var myMap, myPlacemark;

var currentPlacemark = null;   // текущая точка (клик)
var savedPlacemark = null;     // сохранённая точка



ymaps.ready(function () {

    myMap = new ymaps.Map("map", {
        center: pendingCenter ?? [56.63, 43.40],
        zoom: pendingZoom ?? 10,
        controls: ['searchControl']
    });

    mapReady = true;

    myMap.events.add('click', function (e) {

    var coords = e.get('coords');

    ymaps.geocode(coords).then(function (res) {

        var firstGeoObject = res.geoObjects.get(0);

        if (!firstGeoObject)
            return;

        var meta = firstGeoObject.properties.get('metaDataProperty');

        if (!meta || !meta.GeocoderMetaData)
            return;

        var precision = meta.GeocoderMetaData.precision;

        // только точный дом
        if (precision !== "exact") {
            alert("Выберите точный адрес дома");
            return;
        }

        // полный адрес
        var address = firstGeoObject.getAddressLine();

        // проверка города
        var text = address.toLowerCase();

        var isZavolzhye =
            text.includes("заволжье") &&
            text.includes("нижегород");

        if (!isZavolzhye) {
            alert("Можно выбирать адреса только в городе Заволжье");
            return;
        }

        // ставим метку ТОЛЬКО после проверки
        setPlacemark(coords);

        window.chrome.webview.postMessage({
            lat: coords[0],
            lon: coords[1],
            zoom: myMap.getZoom(),
            address: address
        });

    });

});
});

function setPlacemark(coords) {
    if (myPlacemark) {
        myPlacemark.geometry.setCoordinates(coords);
    } else {
        myPlacemark = new ymaps.Placemark(coords);
        myMap.geoObjects.add(myPlacemark);
    }
}
// 👉 текущая точка (новый клик)
function setCurrentPlacemark(coords) {
    if (currentPlacemark) {
        currentPlacemark.geometry.setCoordinates(coords);
    } else {
        currentPlacemark = new ymaps.Placemark(coords, {
            balloonContent: "Выбранная точка"
        }, {
            preset: 'islands#redIcon'
        });

        myMap.geoObjects.add(currentPlacemark);
    }
}


// 👉 старая точка (из сохранения)
function setSavedPlacemark(lat, lon) {
    var coords = [lat, lon];

    if (savedPlacemark) {
        savedPlacemark.geometry.setCoordinates(coords);
    } else {
        savedPlacemark = new ymaps.Placemark(coords, {
            balloonContent: "Сохранённая точка"
        }, {
            preset: 'islands#blueIcon'
        });

        myMap.geoObjects.add(savedPlacemark);
    }
}


function setInitialLocation(lat, lon, zoom) {

    lat = Number(lat);
    lon = Number(lon);
    zoom = Number(zoom);

    if (!isFinite(lat) || !isFinite(lon))
        return;

    // Заволжье
    if (lat < 56 || lat > 57 || lon < 42 || lon > 45)
        return;

    var center = [lat, lon];

    if (mapReady) {

        myMap.setCenter(center, zoom || 16);
        setSavedPlacemark(lat, lon);

    } else {

        pendingCenter = center;
        pendingZoom = zoom;
    }
}
</script>
</head>

<body>
<div id="map" style="width:100%; height:97vh;"></div>
</body>
</html>
